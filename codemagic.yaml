workflows:
  iceharbor-check:
    name: IceHarbor Project Check
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Check Godot project
        script: |
          echo "Checking IceHarbor project..."
          find . -name project.godot -print
          test -f project.godot || test -f IceHarbor/project.godot
          echo "Godot project found!"
        
